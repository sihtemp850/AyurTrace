<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Neem tree and leaves -->
  <g transform="translate(100,100)">
    <!-- Main trunk -->
    <rect x="-3" y="20" width="6" height="25" fill="#8b4513" rx="3"/>
    
    <!-- Main branches -->
    <line x1="0" y1="10" x2="-25" y2="-15" stroke="#8b4513" stroke-width="3"/>
    <line x1="0" y1="5" x2="25" y2="-20" stroke="#8b4513" stroke-width="3"/>
    <line x1="0" y1="0" x2="-15" y2="-30" stroke="#8b4513" stroke-width="2"/>
    <line x1="0" y1="-5" x2="20" y2="-35" stroke="#8b4513" stroke-width="2"/>
    
    <!-- Neem leaves (compound leaves) -->
    <!-- Left branch leaves -->
    <g transform="translate(-25, -15)">
      <ellipse cx="-8" cy="-5" rx="3" ry="8" fill="#22c55e" transform="rotate(-20)"/>
      <ellipse cx="-4" cy="-12" rx="3" ry="8" fill="#16a34a" transform="rotate(-10)"/>
      <ellipse cx="0" cy="-8" rx="3" ry="8" fill="#22c55e"/>
      <ellipse cx="4" cy="-12" rx="3" ry="8" fill="#16a34a" transform="rotate(10)"/>
      <ellipse cx="8" cy="-5" rx="3" ry="8" fill="#22c55e" transform="rotate(20)"/>
    </g>
    
    <!-- Right branch leaves -->
    <g transform="translate(25, -20)">
      <ellipse cx="-6" cy="-8" rx="3" ry="8" fill="#22c55e" transform="rotate(-15)"/>
      <ellipse cx="-2" cy="-15" rx="3" ry="8" fill="#16a34a" transform="rotate(-5)"/>
      <ellipse cx="2" cy="-12" rx="3" ry="8" fill="#22c55e" transform="rotate(5)"/>
      <ellipse cx="6" cy="-8" rx="3" ry="8" fill="#16a34a" transform="rotate(15)"/>
    </g>
    
    <!-- Top branch leaves -->
    <g transform="translate(-15, -30)">
      <ellipse cx="-4" cy="-5" rx="3" ry="8" fill="#22c55e" transform="rotate(-25)"/>
      <ellipse cx="0" cy="-8" rx="3" ry="8" fill="#16a34a"/>
      <ellipse cx="4" cy="-5" rx="3" ry="8" fill="#22c55e" transform="rotate(25)"/>
    </g>
    
    <g transform="translate(20, -35)">
      <ellipse cx="-3" cy="-3" rx="3" ry="8" fill="#22c55e" transform="rotate(-20)"/>
      <ellipse cx="0" cy="-6" rx="3" ry="8" fill="#16a34a"/>
      <ellipse cx="3" cy="-3" rx="3" ry="8" fill="#22c55e" transform="rotate(20)"/>
    </g>
    
    <!-- Small neem flowers -->
    <circle cx="-20" cy="-10" r="1.5" fill="#ffffff"/>
    <circle cx="22" cy="-15" r="1.5" fill="#ffffff"/>
    <circle cx="-12" cy="-25" r="1" fill="#ffffff"/>
    <circle cx="18" cy="-30" r="1" fill="#ffffff"/>
    
    <!-- Neem fruits (small green berries) -->
    <ellipse cx="-18" cy="-5" rx="2" ry="3" fill="#84cc16"/>
    <ellipse cx="20" cy="-12" rx="2" ry="3" fill="#84cc16"/>
    <ellipse cx="-10" cy="-22" rx="1.5" ry="2.5" fill="#84cc16"/>
    
    <!-- Ground/roots indication -->
    <ellipse cx="0" cy="45" rx="30" ry="3" fill="#92400e" opacity="0.3"/>
  </g>
  
  <!-- Label -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Neem Leaves</text>
</svg>
