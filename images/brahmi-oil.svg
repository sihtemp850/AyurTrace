<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Brahmi plant and oil bottle -->
  <g transform="translate(100,100)">
    <!-- Oil bottle -->
    <rect x="-8" y="10" width="16" height="35" rx="2" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <rect x="-6" y="12" width="12" height="31" fill="#059669" opacity="0.8"/>
    
    <!-- Bottle cap -->
    <rect x="-6" y="5" width="12" height="8" rx="1" fill="#6b7280"/>
    <circle cx="0" cy="9" r="2" fill="#9ca3af"/>
    
    <!-- Oil drops -->
    <circle cx="15" cy="35" r="2" fill="#059669" opacity="0.6"/>
    <circle cx="20" cy="40" r="1.5" fill="#059669" opacity="0.6"/>
    <circle cx="-18" cy="38" r="1.5" fill="#059669" opacity="0.6"/>
    
    <!-- Brahmi plant -->
    <!-- Main stems -->
    <line x1="-25" y1="45" x2="-25" y2="-20" stroke="#16a34a" stroke-width="2"/>
    <line x1="25" y1="45" x2="25" y2="-15" stroke="#16a34a" stroke-width="2"/>
    
    <!-- Brahmi leaves (small, rounded) -->
    <ellipse cx="-30" cy="-10" rx="4" ry="6" fill="#22c55e"/>
    <ellipse cx="-20" cy="-15" rx="4" ry="6" fill="#22c55e"/>
    <ellipse cx="-25" cy="-5" rx="3" ry="5" fill="#16a34a"/>
    <ellipse cx="-15" cy="0" rx="4" ry="6" fill="#22c55e"/>
    <ellipse cx="-30" cy="10" rx="3" ry="5" fill="#16a34a"/>
    <ellipse cx="-20" cy="15" rx="4" ry="6" fill="#22c55e"/>
    
    <ellipse cx="30" cy="-5" rx="4" ry="6" fill="#22c55e"/>
    <ellipse cx="20" cy="-10" rx="4" ry="6" fill="#22c55e"/>
    <ellipse cx="25" cy="0" rx="3" ry="5" fill="#16a34a"/>
    <ellipse cx="15" cy="5" rx="4" ry="6" fill="#22c55e"/>
    <ellipse cx="30" cy="15" rx="3" ry="5" fill="#16a34a"/>
    <ellipse cx="20" cy="20" rx="4" ry="6" fill="#22c55e"/>
    
    <!-- Small white flowers -->
    <circle cx="-22" cy="-20" r="2" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.5"/>
    <circle cx="22" cy="-18" r="2" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.5"/>
    <circle cx="-18" cy="25" r="1.5" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.5"/>
    <circle cx="18" cy="28" r="1.5" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.5"/>
    
    <!-- Flower centers -->
    <circle cx="-22" cy="-20" r="0.5" fill="#fbbf24"/>
    <circle cx="22" cy="-18" r="0.5" fill="#fbbf24"/>
    <circle cx="-18" cy="25" r="0.5" fill="#fbbf24"/>
    <circle cx="18" cy="28" r="0.5" fill="#fbbf24"/>
    
    <!-- Ground/roots -->
    <ellipse cx="0" cy="45" rx="40" ry="5" fill="#92400e" opacity="0.3"/>
  </g>
  
  <!-- Label -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Brahmi Oil</text>
</svg>
