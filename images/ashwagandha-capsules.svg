<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Ashwagandha plant leaves -->
  <g transform="translate(100,100)">
    <!-- Main stem -->
    <line x1="0" y1="20" x2="0" y2="-30" stroke="#22c55e" stroke-width="3"/>
    
    <!-- Leaves -->
    <ellipse cx="-15" cy="-10" rx="12" ry="20" fill="#16a34a" transform="rotate(-20)"/>
    <ellipse cx="15" cy="-10" rx="12" ry="20" fill="#16a34a" transform="rotate(20)"/>
    <ellipse cx="-10" cy="-35" rx="8" ry="15" fill="#15803d" transform="rotate(-10)"/>
    <ellipse cx="10" cy="-35" rx="8" ry="15" fill="#15803d" transform="rotate(10)"/>
    
    <!-- Capsules -->
    <g transform="translate(-25, 25)">
      <!-- Capsule 1 -->
      <rect x="0" y="0" width="12" height="25" rx="6" fill="#dc2626"/>
      <rect x="0" y="12" width="12" height="13" rx="6" fill="#fbbf24"/>
    </g>
    
    <g transform="translate(-5, 30)">
      <!-- Capsule 2 -->
      <rect x="0" y="0" width="12" height="25" rx="6" fill="#dc2626"/>
      <rect x="0" y="12" width="12" height="13" rx="6" fill="#fbbf24"/>
    </g>
    
    <g transform="translate(15, 25)">
      <!-- Capsule 3 -->
      <rect x="0" y="0" width="12" height="25" rx="6" fill="#dc2626"/>
      <rect x="0" y="12" width="12" height="13" rx="6" fill="#fbbf24"/>
    </g>
    
    <!-- Small berries on plant -->
    <circle cx="-20" cy="0" r="3" fill="#dc2626"/>
    <circle cx="20" cy="5" r="3" fill="#dc2626"/>
    <circle cx="-5" cy="-20" r="2" fill="#dc2626"/>
  </g>
  
  <!-- Label -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Ashwagandha Capsules</text>
</svg>
