<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Mixed herbs collection -->
  <g transform="translate(100,100)">
    <!-- Amla (left side) -->
    <g transform="translate(-30, -10)">
      <circle cx="0" cy="0" r="8" fill="#84cc16" stroke="#65a30d" stroke-width="1"/>
      <circle cx="0" cy="0" r="6" fill="#a3e635" opacity="0.7"/>
      <line x1="0" y1="-8" x2="0" y2="-15" stroke="#16a34a" stroke-width="2"/>
      <ellipse cx="-3" cy="-12" rx="2" ry="5" fill="#22c55e" transform="rotate(-20)"/>
      <ellipse cx="3" cy="-12" rx="2" ry="5" fill="#22c55e" transform="rotate(20)"/>
    </g>
    
    <!-- Tulsi (right side) -->
    <g transform="translate(25, -15)">
      <line x1="0" y1="10" x2="0" y2="-15" stroke="#16a34a" stroke-width="2"/>
      <ellipse cx="-4" cy="-5" rx="3" ry="6" fill="#22c55e"/>
      <ellipse cx="4" cy="-5" rx="3" ry="6" fill="#22c55e"/>
      <ellipse cx="-2" cy="-12" rx="2" ry="4" fill="#16a34a"/>
      <ellipse cx="2" cy="-12" rx="2" ry="4" fill="#16a34a"/>
      <circle cx="0" cy="-18" r="1.5" fill="#8b5cf6"/>
    </g>
    
    <!-- Ginger (center bottom) -->
    <g transform="translate(0, 15)">
      <ellipse cx="0" cy="0" rx="15" ry="5" fill="#f59e0b" transform="rotate(10)"/>
      <ellipse cx="-8" cy="-2" rx="8" ry="3" fill="#d97706" transform="rotate(-5)"/>
      <ellipse cx="8" cy="2" rx="6" ry="3" fill="#d97706" transform="rotate(15)"/>
      <circle cx="-10" cy="-1" r="2" fill="#c2410c"/>
      <circle cx="6" cy="3" r="1.5" fill="#c2410c"/>
    </g>
    
    <!-- Cardamom pods (top center) -->
    <g transform="translate(-5, -25)">
      <ellipse cx="0" cy="0" rx="3" ry="8" fill="#84cc16"/>
      <ellipse cx="5" cy="2" rx="3" ry="8" fill="#84cc16" transform="rotate(15)"/>
      <ellipse cx="-3" cy="3" rx="3" ry="8" fill="#84cc16" transform="rotate(-10)"/>
      <line x1="0" y1="-8" x2="0" y2="-5" stroke="#16a34a" stroke-width="1"/>
      <line x1="5" y1="-6" x2="5" y2="-3" stroke="#16a34a" stroke-width="1"/>
      <line x1="-3" y1="-5" x2="-3" y2="-2" stroke="#16a34a" stroke-width="1"/>
    </g>
    
    <!-- Cinnamon sticks (right bottom) -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="12" height="3" rx="1.5" fill="#92400e" transform="rotate(20)"/>
      <rect x="2" y="4" width="10" height="3" rx="1.5" fill="#92400e" transform="rotate(15)"/>
      <rect x="-2" y="8" width="8" height="3" rx="1.5" fill="#92400e" transform="rotate(25)"/>
    </g>
    
    <!-- Cloves (left bottom) -->
    <g transform="translate(-20, 25)">
      <circle cx="0" cy="0" r="2" fill="#7c2d12"/>
      <line x1="0" y1="-2" x2="0" y2="-8" stroke="#7c2d12" stroke-width="2"/>
      <circle cx="4" cy="2" r="2" fill="#7c2d12"/>
      <line x1="4" y1="0" x2="4" y2="-6" stroke="#7c2d12" stroke-width="2"/>
      <circle cx="-3" cy="3" r="2" fill="#7c2d12"/>
      <line x1="-3" y1="1" x2="-3" y2="-5" stroke="#7c2d12" stroke-width="2"/>
    </g>
    
    <!-- Scattered small herbs -->
    <circle cx="10" cy="-5" r="1.5" fill="#22c55e"/>
    <circle cx="-15" cy="5" r="1" fill="#f59e0b"/>
    <circle cx="15" cy="8" r="1.5" fill="#84cc16"/>
    <circle cx="-8" cy="-18" r="1" fill="#8b5cf6"/>
  </g>
  
  <!-- Label -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Mixed Herbs</text>
</svg>
