<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Turmeric root and powder -->
  <g transform="translate(100,100)">
    <!-- Turmeric roots -->
    <ellipse cx="-20" cy="-10" rx="25" ry="8" fill="#d97706" transform="rotate(-15)"/>
    <ellipse cx="15" cy="-5" rx="20" ry="6" fill="#d97706" transform="rotate(10)"/>
    <ellipse cx="-5" cy="5" rx="18" ry="5" fill="#ea580c"/>
    
    <!-- Root segments -->
    <circle cx="-25" cy="-15" r="4" fill="#c2410c"/>
    <circle cx="20" cy="-8" r="3" fill="#c2410c"/>
    <circle cx="-8" cy="8" r="3" fill="#c2410c"/>
    
    <!-- Powder pile -->
    <ellipse cx="0" cy="25" rx="35" ry="15" fill="#f59e0b"/>
    <ellipse cx="0" cy="20" rx="30" ry="12" fill="#fbbf24"/>
    <ellipse cx="0" cy="15" rx="25" ry="8" fill="#fcd34d"/>
    
    <!-- Powder texture -->
    <circle cx="-15" cy="25" r="2" fill="#f59e0b" opacity="0.7"/>
    <circle cx="10" cy="28" r="1.5" fill="#f59e0b" opacity="0.7"/>
    <circle cx="-5" cy="22" r="1" fill="#f59e0b" opacity="0.7"/>
    <circle cx="20" cy="25" r="1.5" fill="#f59e0b" opacity="0.7"/>
    
    <!-- Leaves -->
    <ellipse cx="-30" cy="-25" rx="8" ry="15" fill="#16a34a" transform="rotate(-30)"/>
    <ellipse cx="25" cy="-20" rx="6" ry="12" fill="#16a34a" transform="rotate(25)"/>
    <ellipse cx="0" cy="-30" rx="5" ry="10" fill="#15803d"/>
    
    <!-- Leaf veins -->
    <line x1="-30" y1="-30" x2="-30" y2="-15" stroke="#15803d" stroke-width="1"/>
    <line x1="25" y1="-25" x2="25" y2="-15" stroke="#15803d" stroke-width="1"/>
  </g>
  
  <!-- Label -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Turmeric Powder</text>
</svg>
